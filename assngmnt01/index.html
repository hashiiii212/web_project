<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Horizon - Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>Event Horizon</h1>
        <p class="tagline">Manage Your Events Effortlessly</p>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Search Bar Section -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-bar" 
                placeholder="Search events by name or date (YYYY-MM-DD)..."
            >
        </div>

        <!-- Add Event Form Section -->
        <section class="form-section">
            <h2>Add New Event</h2>
            <form id="eventForm" class="event-form">
                <div class="form-group">
                    <label for="eventName">Event Name:</label>
                    <input 
                        type="text" 
                        id="eventName" 
                        placeholder="Enter event name" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="eventDate">Event Date:</label>
                    <input 
                        type="date" 
                        id="eventDate" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="eventDescription">Event Description:</label>
                    <textarea 
                        id="eventDescription" 
                        placeholder="Enter event description" 
                        rows="4" 
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn-add">Add Event</button>
            </form>
            <div id="warningMessage" class="warning-message"></div>
        </section>

        <!-- Events Display Section -->
        <section class="events-section">
            <h2>Upcoming Events</h2>
            <div id="eventsList" class="events-grid">
                <!-- Events will be dynamically added here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; <span id="currentYear"></span> - Created by: [Your Name]. All rights reserved.</p>
    </footer>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
