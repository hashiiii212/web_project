<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    nav {
      background-color: #333;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-weight: bold;
    }
    nav a:hover {
      color: #ddd;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 5px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 72px;
      color: #e74c3c;
      margin: 0;
    }
    p {
      font-size: 18px;
      color: #666;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #333;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
    a:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </nav>

  <div class="container">
    <h1>404</h1>
    <p>Oops! Page not found.</p>
    <p>The page you're looking for doesn't exist. Please check the URL and try again.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
